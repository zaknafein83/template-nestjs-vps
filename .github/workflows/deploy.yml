name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/myapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::Chiave SSH non parsabile"; exit 1; }
          ssh-keyscan -4 -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload docker-compose.yml
        run: |
          scp -4 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              docker-compose.yml \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/myapp/docker-compose.yml

      - name: Deploy
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          ssh -4 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash <<EOF
            set -euo pipefail
            cd /opt/myapp
            echo "TAG=${TAG}" > .deploy-tag
            TAG=${TAG} docker compose pull
            TAG=${TAG} docker compose up -d
            TAG=${TAG} docker compose ps
          EOF

      - name: Healthcheck
        run: |
          for i in $(seq 1 20); do
            if ssh -4 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
                   ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
                 "curl -fsS --max-time 3 http://127.0.0.1:3000/health > /dev/null"; then
              echo "✅ healthcheck OK al tentativo $i"
              exit 0
            fi
            sleep 5
          done
          echo "::error::healthcheck non passato dopo 100s"
          ssh -4 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/myapp && docker compose logs --tail=80 app" || true
          exit 1
