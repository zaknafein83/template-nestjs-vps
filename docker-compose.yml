services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       myapp
      POSTGRES_USER:     myapp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-myapp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mongo alternativo (decommenta e commenta il blocco Postgres sopra)
  # db:
  #   image: mongo:7
  #   restart: unless-stopped
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: myapp
  #     MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-myapp}
  #   volumes:
  #     - mongodata:/data/db

  app:
    image: ghcr.io/zaknafein83/myapp:${TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL:  postgres://myapp:${DB_PASSWORD:-myapp}@db:5432/myapp
      # MONGO_URI:   mongodb://myapp:${DB_PASSWORD:-myapp}@db:27017/myapp?authSource=admin
      JWT_SECRET:    ${JWT_SECRET:-dev-secret-key-must-be-at-least-32-chars}
      CORS_ORIGINS:  ${CORS_ORIGINS:-http://localhost:5173}
      NODE_ENV:      production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  # mongodata:
